version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: recipe_backend2
    ports:
      - "8000:8000"
    volumes:
      - ./skupno.db3:/data/skupno.db3
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: recipe_frontend2
    ports:
      - "8080:80"   #8080 na hostu za frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
